name: Keymap Artwork

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          pipx install keymap-drawer
          pipx install west

      - name: Fetch west modules
        run: |
          west init -l config
          west config --local manifest.project-filter " -zmk,-zephyr"
          west update --fetch-opt=--filter=tree:0

      - name: Draw keymaps
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p keymap

          config_arg=()
          if [[ -f keymap_drawer.config.yaml ]]; then
            config_arg=(-c keymap_drawer.config.yaml)
          fi

          for keymap_file in config/*.keymap; do
            keyboard="$(basename "$keymap_file" .keymap)"
            dts_layout="config/boards/shields/$keyboard/$keyboard.dtsi"
            draw_args=()

            if [[ -f "$dts_layout" ]]; then
              draw_args=(-d "$dts_layout" -l physical_layout_0)
            fi

            echo "Drawing $keyboard"
            tmp_yaml="$(mktemp)"
            tmp_svg="$(mktemp)"

            keymap "${config_arg[@]}" parse -z "$keymap_file" > "$tmp_yaml"
            mv "$tmp_yaml" "keymap/$keyboard.yaml"

            keymap "${config_arg[@]}" draw "${draw_args[@]}" "keymap/$keyboard.yaml" > "$tmp_svg"
            mv "$tmp_svg" "keymap/$keyboard.svg"
          done

      - name: Commit updated artwork
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- keymap; then
            echo "No keymap artwork changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap/*.yaml keymap/*.svg
          git commit -m "keymap-drawer render"
          git push
