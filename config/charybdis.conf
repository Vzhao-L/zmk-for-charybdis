CONFIG_BT_LL_SW_LLCP_LEGACY=y

CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 启用键盘RGB功能
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3


# 1. 마우스 포인팅 드라이버 안정화 및 노이즈 필터링 활성화
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# 2. 마우스 값이 급격하게 튀는 것을 방지하는 입력 보간(인터폴레이션) 활성화
# 클릭 신호와 좌표 신호가 겹칠 때 커서가 요동치는 것을 부드럽게 잡아줍니다.
CONFIG_ZMK_POINTING_SMOOTH=y

# 3. 분할 키보드 간의 무선 통신(BLE) 전력 강도를 최대로 높여 노이즈 간섭 차단
# 양쪽 전파가 약하면 클릭 신호가 넘어올 때 센서 값이 오염될 수 있습니다.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

